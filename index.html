<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OLX Checker Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: var(--tg-theme-bg-color, #121212);
      color: var(--tg-theme-text-color, #ffffff);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="p-4">
  <div id="app" class="max-w-md mx-auto space-y-4">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-gray-800 pb-3">
      <h1 class="text-xl font-bold text-emerald-400">OLX Checker <span class="text-xs bg-emerald-950 text-emerald-300 px-2 py-0.5 rounded border border-emerald-800">BETA</span></h1>
      <span class="text-xs text-gray-400">Безкоштовний режим</span>
    </div>

    <!-- Search Form -->
    <div class="space-y-2">
      <label class="block text-sm font-medium text-gray-300">Пошук оголошень OLX</label>
      <input type="text" id="searchInput" placeholder="Наприклад: iPhone 11" 
             class="w-full p-3 rounded-xl bg-gray-900 border border-gray-700 text-white focus:outline-none focus:border-emerald-500 transition">
      <button onclick="runSearch()" id="searchBtn" 
              class="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-semibold py-3 rounded-xl transition flex items-center justify-center">
        Знайти оголошення
      </button>
    </div>

    <!-- Analytics Dashboard -->
    <div id="analytics" class="hidden p-4 rounded-xl bg-gray-900 border border-gray-800 space-y-2">
      <div class="text-xs text-gray-400">Аналітика ринку</div>
      <div class="flex justify-between items-end">
        <div>
          <div class="text-2xl font-bold text-white" id="avgPrice">0 грн</div>
          <div class="text-xs text-gray-400">Середня ціна на ринку</div>
        </div>
        <span id="itemsCount" class="text-xs bg-blue-900/50 text-blue-300 px-2.5 py-1 rounded-full border border-blue-800">Аналіз 0 товарів</span>
      </div>
    </div>

    <!-- Subscriptions & Referral Teaser -->
    <div class="p-3 rounded-xl bg-gradient-to-r from-emerald-950/40 to-gray-900 border border-emerald-900/50 flex justify-between items-center">
      <div>
        <div class="text-sm font-semibold text-emerald-300">PRO підписка & Бонуси</div>
        <div class="text-xs text-gray-400">Моніторинг 24/7 без затримок</div>
      </div>
      <button onclick="alert('Реферальна програма та PRO-підписка будуть доступні після бета-тесту!')" 
              class="text-xs bg-emerald-500/20 text-emerald-300 px-3 py-1.5 rounded-lg border border-emerald-500/30">
        Детальніше
      </button>
    </div>

    <!-- Results Feed -->
    <div id="results" class="space-y-3"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // URL вашего бекенда на Render
    const BACKEND_URL = 'https://olx-checker-backend.onrender.com';

    async function runSearch() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const btn = document.getElementById('searchBtn');
      const resultsDiv = document.getElementById('results');
      const analyticsDiv = document.getElementById('analytics');

      btn.disabled = true;
      btn.innerText = 'Шукаємо...';
      resultsDiv.innerHTML = '<div class="text-center text-gray-400 py-8">Завантаження даних з OLX...</div>';

      try {
        const res = await fetch(`${BACKEND_URL}/api/search?query=${encodeURIComponent(query)}`);
        const data = await res.json();

        if (!data.success || !data.items || data.items.length === 0) {
          resultsDiv.innerHTML = '<div class="text-center text-red-400 py-4">Оголошень не знайдено або OLX обмежив доступ.</div>';
          analyticsDiv.classList.add('hidden');
          return;
        }

        // Отображение аналитики
        document.getElementById('avgPrice').innerText = `${data.averagePrice.toLocaleString('uk-UA')} грн`;
        document.getElementById('itemsCount').innerText = `Знайдено ${data.count} товарів`;
        analyticsDiv.classList.remove('hidden');

        // Рендер карточек
        resultsDiv.innerHTML = data.items.map(item => {
          const isCheap = item.price > 0 && item.price < data.averagePrice * 0.85;
          const discount = isCheap ? Math.round((1 - item.price / data.averagePrice) * 100) : 0;

          return `
            <a href="${item.link}" target="_blank" class="block p-3 rounded-xl bg-gray-900 border ${isCheap ? 'border-emerald-500' : 'border-gray-800'} space-y-2 hover:border-gray-700 transition">
              <div class="flex gap-3">
                ${item.img ? `<img src="${item.img}" class="w-20 h-20 object-cover rounded-lg bg-gray-800 flex-shrink-0">` : '<div class="w-20 h-20 bg-gray-800 rounded-lg flex items-center justify-center text-xs text-gray-500">Без фото</div>'}
                <div class="flex-1 min-w-0">
                  <div class="text-sm font-medium text-white truncate">${item.title}</div>
                  <div class="text-lg font-bold ${isCheap ? 'text-emerald-400' : 'text-white'} mt-1">${item.priceText || item.price + ' грн'}</div>
                  <div class="text-xs text-gray-400 mt-1 truncate">${item.locationDate || ''}</div>
                </div>
              </div>
              ${isCheap ? `<div class="text-xs bg-emerald-950 text-emerald-300 px-2 py-1 rounded border border-emerald-800 text-center font-medium">🔥 Вигідно! Нижче ринку на ${discount}%</div>` : ''}
            </a>
          `;
        }).join('');

      } catch (err) {
        console.error(err);
        resultsDiv.innerHTML = '<div class="text-center text-red-400 py-4">Помилка з\'єднання з сервером.</div>';
      } finally {
        btn.disabled = false;
        btn.innerText = 'Знайти оголошення';
      }
    }
  </script>
</body>
</html>
