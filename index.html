<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLX Checker Beta 1.0</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #16191e;
      --accent: #00ff88;
      --text: #ffffff;
      --text-muted: #8a909a;
      --danger: #ff4757;
    }
    body {
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding-bottom: 70px;
    }
    .container { padding: 16px; }
    .nav-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      height: 60px;
      background: var(--card-bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #22272e;
    }
    .nav-item {
      color: var(--text-muted);
      font-size: 12px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }
    .nav-item.active { color: var(--accent); }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
    .btn-danger { background: var(--danger); color: #fff; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-val { font-size: 22px; font-weight: bold; color: var(--accent); }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background: #22272e;
      border: 1px solid #333;
      color: #fff;
      border-radius: 6px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div class="container" id="app">
    <!-- Главный поисковый экран -->
    <div id="screen-main">
      <h2>🔍 OLX Checker</h2>
      <div class="card">
        <p>Моніторинг оголошень активовано. Створюйте фільтри та отримуйте сповіщення у чат.</p>
      </div>
    </div>

    <!-- Раздел Администрирования (Отображается только администраторам) -->
    <div id="screen-admin" style="display: none;">
      <h2>⚙️ Адміністрування</h2>
      
      <div class="grid card">
        <div>
          <div class="stat-val" id="adm-users">-</div>
          <small>Користувачів</small>
        </div>
        <div>
          <div class="stat-val" id="adm-filters">-</div>
          <small>Фільтрів</small>
        </div>
        <div>
          <div class="stat-val" id="adm-premium">-</div>
          <small>Premium</small>
        </div>
        <div>
          <div class="stat-val" id="adm-refs">-</div>
          <small>Рефералів</small>
        </div>
      </div>

      <div class="card">
        <h3>Управління Premium</h3>
        <input type="number" id="grant-id" placeholder="Telegram ID користувача">
        <input type="number" id="grant-days" placeholder="Кількість днів" value="30">
        <button class="btn" onclick="grantPremium()">Видати Premium</button>
        <button class="btn btn-danger" style="margin-top: 8px;" onclick="revokePremium()">Відкликати Premium</button>
      </div>
    </div>
  </div>

  <!-- Нижняя панель навигации -->
  <div class="nav-bar">
    <div class="nav-item active" id="tab-main" onclick="showScreen('main')">🔍 Пошук</div>
    <div class="nav-item" id="admin-tab" style="display: none;" onclick="showScreen('admin')">⚙️ Адмін</div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const initData = tg?.initData || '';
    const userId = tg?.initDataUnsafe?.user?.id || 668277478;

    async function initProfile() {
      try {
        const res = await fetch(`/api/user/profile?userId=${userId}`, {
          headers: { 'x-telegram-init-data': initData }
        });
        const data = await res.json();
        
        if (data.isAdmin) {
          document.getElementById('admin-tab').style.display = 'flex';
          loadAdminStats();
        }

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('screen') === 'admin' && data.isAdmin) {
          showScreen('admin');
        }
      } catch (e) {
        console.error('Помилка завантаження профілю:', e);
      }
    }

    function showScreen(name) {
      document.getElementById('screen-main').style.display = name === 'main' ? 'block' : 'none';
      document.getElementById('screen-admin').style.display = name === 'admin' ? 'block' : 'none';
      
      document.getElementById('tab-main').classList.toggle('active', name === 'main');
      document.getElementById('admin-tab').classList.toggle('active', name === 'admin');
    }

    async function loadAdminStats() {
      try {
        const res = await fetch(`/api/admin/stats?adminId=${userId}`, {
          headers: { 'x-telegram-init-data': initData }
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('adm-users').innerText = data.stats.users;
          document.getElementById('adm-filters').innerText = data.stats.filters;
          document.getElementById('adm-premium').innerText = data.stats.premium;
          document.getElementById('adm-refs').innerText = data.stats.referrals;
        }
      } catch (e) {}
    }

    async function grantPremium() {
      const targetUserId = document.getElementById('grant-id').value;
      const days = document.getElementById('grant-days').value;
      
      if (!targetUserId) {
        alert('Будь ласка, вкажіть Telegram ID');
        return;
      }

      const res = await fetch('/api/admin/grant-premium', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-telegram-init-data': initData
        },
        body: JSON.stringify({ adminId: userId, targetUserId, days })
      });
      const data = await res.json();
      if (data.success) {
        alert('Premium успішно надано!');
        loadAdminStats();
      } else {
        alert('Помилка: ' + data.error);
      }
    }

    async function revokePremium() {
      const targetUserId = document.getElementById('grant-id').value;
      
      if (!targetUserId) {
        alert('Будь ласка, вкажіть Telegram ID');
        return;
      }

      const res = await fetch('/api/admin/revoke-premium', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-telegram-init-data': initData
        },
        body: JSON.stringify({ adminId: userId, targetUserId })
      });
      const data = await res.json();
      if (data.success) {
        alert('Premium відкликано!');
        loadAdminStats();
      } else {
        alert('Помилка: ' + data.error);
      }
    }

    initProfile();
  </script>
</body>
</html>
