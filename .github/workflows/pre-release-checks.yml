name: Pre-release checks
permissions:
  contents: write

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "pre-release/**", "feature/smart-search-v1"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Commit generated lockfile on isolated diagnostic branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: add reproducible npm lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - run: node --check server.js
      - run: npm test

      - name: Temporary live OLX diagnostic
        run: node scripts/olx-live-diagnostic.js
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: olx-live-diagnostic
          path: olx-live-diagnostic.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
