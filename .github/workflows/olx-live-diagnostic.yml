name: OLX live diagnostic (temporary)
on:
  push:
    branches:
      - fix/znaydeno-search-release-hardening-2026-11-09
  workflow_dispatch:
jobs:
  olx-live-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Fetch one city-scoped OLX query and page 2
        run: node scripts/olx-live-diagnostic.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: olx-live-diagnostic
          path: olx-live-diagnostic.json
          if-no-files-found: ignore
