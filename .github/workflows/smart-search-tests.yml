name: Smart Search tests

on:
  push:
    branches:
      - feature/smart-search-v1
      - feature/ai-search-test
  pull_request:
    branches:
      - pre-release/1.0.0-hardening
      - main

jobs:
  smart-search-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Smart Search regression tests
        run: node --test smart-search.test.js
